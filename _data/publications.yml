  - title: "Restoring the Right Measure: Posterior-Consistent Flow Matching for PDE Inverse Problems"
    authors: <strong>Chusong Zhang</strong>
    # conference_short: 
    conference: Preprint, 2026.
    pdf: ./files/CMSP_preprint_1026.pdf
    code: 
    Julia: 
    image: ./assets/img/cmsp_image.png
    # notes: Under Review
    description: >-
      Introduces the **Conditional Minimal Step-Wise Perturbation (CMSP)**
      framework to achieve faithful Bayesian posterior approximation while
      strictly satisfying hard physical constraints in zero-shot PDE inverse
      problems. The method leverages pretrained generative flows to induce
      a conditional vector field directed toward the true posterior, and
      incorporates the **Pre-Image Invariant Spectral Transfer (PIS)**
      algorithm to mitigate the computational and memory complexity of
      the flow-induced covariance-weighted matrix.

  - title: "Asymptotic Inconsistency of Interpolation in Terminal-Projected Flows for PDE Inversion"
    authors: <strong>Chusong Zhang</strong>
    # conference_short: 
    conference: Preprint, 2026.
    pdf: ./files/MSP_preprint_0930.pdf
    image: ./assets/img/msp_image.png
    notes: Under Review
    description: >-
      Audits zero-shot terminal-projection flow samplers, identifying
      that their widely accepted reverse optimal-transport (OT) displacement
      interpolation assumption exhibits progressive asymptotic inconsistency
      after state projection. Introduces the **Minimal Step-wise Perturbation (MSP)**
      framework as an optimization-based reference independent of this invalid
      assumption, and analyzes method discrepancies to uncover how the unrecognized
      surplus velocity field disrupts generative dynamics."


